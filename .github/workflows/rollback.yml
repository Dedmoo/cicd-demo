name: Rollback (Onceki Surume Don)

on:
  workflow_dispatch:
    inputs:
      aciklama:
        description: 'Neden geri aliniyor (ornek: site patladi)'
        required: true
        type: string
      rollback_modu:
        description: 'Geri alma modu'
        required: true
        type: choice
        options:
          - onceki_klasor
          - belirli_commit
        default: onceki_klasor
      commit_sha:
        description: 'Belirli commit SHA (sadece belirli_commit modunda)'
        required: false
        type: string

run-name: Rollback - ${{ github.actor }} - ${{ inputs.aciklama }}

concurrency:
  group: wsl-self-hosted-runner
  cancel-in-progress: true

jobs:
  rollback:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Kodu indir (checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_modu == 'belirli_commit' && inputs.commit_sha || github.ref }}

      - name: Onceki klasorden geri al
        if: inputs.rollback_modu == 'onceki_klasor'
        run: |
          if [ ! -d /opt/helloapi.previous ]; then
            echo "Geri alinacak onceki surum yok (/opt/helloapi.previous)"
            echo "En az bir kez basarili deploy yapilmis olmali."
            exit 1
          fi
          bash .github/scripts/rollback-to-previous.sh

      - name: .NET build ve test (commit rollback)
        if: inputs.rollback_modu == 'belirli_commit'
        uses: ./.github/actions/dotnet-build-test
        with:
          configuration: Release

      - name: Belirli commit deploy et
        if: inputs.rollback_modu == 'belirli_commit'
        run: |
          if [ -z "${{ inputs.commit_sha }}" ]; then
            echo "belirli_commit modu icin commit_sha zorunlu."
            exit 1
          fi
          if [ -d /opt/helloapi ]; then
            rm -rf /opt/helloapi.previous
            cp -a /opt/helloapi /opt/helloapi.previous
          fi
          STAGING=$(mktemp -d)
          dotnet publish HelloApi/HelloApi.csproj --configuration Release --output "$STAGING" /p:UseSharedCompilation=false
          mkdir -p /opt/helloapi
          rsync -a --delete "$STAGING/" /opt/helloapi/
          rm -rf "$STAGING"
          cat > /opt/helloapi/.deploy-info <<EOF
          deploy_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=${{ inputs.commit_sha }}
          deployed_by=${{ github.actor }}
          deploy_kaynak=rollback_commit
          note=${{ inputs.aciklama }}
          EOF
          pkill -f 'dotnet /opt/helloapi' || true
          sleep 1
          systemctl restart helloapi

      - name: Canli saglik kontrolu
        run: bash .github/scripts/verify-health.sh http://127.0.0.1:5191/health

      - name: Rollback ozeti
        if: always()
        run: |
          echo "## Rollback Ozeti" >> "$GITHUB_STEP_SUMMARY"
          echo "- Yapan: **${{ github.actor }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mod: **${{ inputs.rollback_modu }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not: ${{ inputs.aciklama }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /opt/helloapi/.deploy-info ]; then
            echo "- Surum bilgisi:" >> "$GITHUB_STEP_SUMMARY"
            cat /opt/helloapi/.deploy-info >> "$GITHUB_STEP_SUMMARY"
          fi
