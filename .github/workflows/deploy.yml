name: Deploy (Canliya Al)

on:
  workflow_dispatch:
    inputs:
      aciklama:
        description: 'Ne deploy ediliyor (ornek: deneme45 canliya al)'
        required: true
        type: string

run-name: Deploy - ${{ github.actor }} - ${{ inputs.aciklama }}

concurrency:
  group: wsl-self-hosted-runner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Kodu indir (checkout)
        uses: actions/checkout@v4

      - name: Deploy ozeti
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "Deploy eden (buton): ${{ github.actor }}"
          echo "Commit mesaji: $COMMIT_MSG"
          echo "Commit atan: $COMMIT_AUTHOR"
          echo "Deploy notu: ${{ inputs.aciklama }}"
          echo "## Deploy Ozeti" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy eden: **${{ github.actor }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $COMMIT_MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit atan: $COMMIT_AUTHOR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not: ${{ inputs.aciklama }}" >> "$GITHUB_STEP_SUMMARY"

      - name: .NET surumunu dogrula
        run: |
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "dotnet bulunamadi. WSL uzerinde .NET SDK kurulu olmali."
            exit 1
          fi
          DOTNET_VERSION=$(dotnet --version)
          echo "Makinedeki .NET SDK: $DOTNET_VERSION"
          DOTNET_MAJOR=$(echo "$DOTNET_VERSION" | cut -d. -f1)
          if [ "$DOTNET_MAJOR" -lt 8 ]; then
            echo "NET 8 veya ustu SDK gerekli, bulunan: $DOTNET_VERSION"
            exit 1
          fi
          if ! dotnet --list-runtimes | grep -q 'Microsoft.NETCore.App 8\.'; then
            echo "NET 8 runtime eksik. Test ve canli calistirma icin WSL'e bir kez kurulmali:"
            echo "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --runtime dotnet --channel 8.0 --install-dir /usr/lib/dotnet"
            echo "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --runtime aspnetcore --channel 8.0 --install-dir /usr/lib/dotnet"
            exit 1
          fi
          echo "NET 8 runtime mevcut"

      - name: Bagimliliklari yukle (restore)
        run: dotnet restore /p:UseSharedCompilation=false

      - name: Projeyi derle (build)
        run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false

      - name: Testleri calistir
        run: dotnet test --no-build --configuration Release --verbosity normal /p:UseSharedCompilation=false

      - name: Mevcut surumu yedekle
        run: |
          if [ -d /opt/helloapi ]; then
            rm -rf /opt/helloapi.previous
            cp -a /opt/helloapi /opt/helloapi.previous
            echo "Onceki surum /opt/helloapi.previous olarak saklandi"
            echo "- Onceki surum yedeklendi (rollback icin)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ilk deploy, geri alinacak onceki surum yok"
          fi

      - name: Yayinla (publish)
        run: |
          STAGING=$(mktemp -d)
          dotnet publish HelloApi/HelloApi.csproj --configuration Release --output "$STAGING" /p:UseSharedCompilation=false
          mkdir -p /opt/helloapi
          rsync -a --delete "$STAGING/" /opt/helloapi/
          rm -rf "$STAGING"
          cat > /opt/helloapi/.deploy-info <<EOF
          deploy_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=${{ github.sha }}
          deployed_by=${{ github.actor }}
          note=${{ inputs.aciklama }}
          EOF

      - name: Servisi yeniden baslat
        run: |
          pkill -f 'dotnet /opt/helloapi' || true
          sleep 1
          systemctl restart helloapi
