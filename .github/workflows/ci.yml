name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: wsl-self-hosted-runner
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      - name: Kodu indir (checkout)
        uses: actions/checkout@v4

      - name: .NET surumunu dogrula
        run: |
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "dotnet bulunamadi. WSL uzerinde .NET SDK kurulu olmali."
            exit 1
          fi
          DOTNET_VERSION=$(dotnet --version)
          echo "Makinedeki .NET SDK: $DOTNET_VERSION"
          DOTNET_MAJOR=$(echo "$DOTNET_VERSION" | cut -d. -f1)
          if [ "$DOTNET_MAJOR" -lt 8 ]; then
            echo "NET 8 veya ustu SDK gerekli, bulunan: $DOTNET_VERSION"
            exit 1
          fi
          if ! dotnet --list-runtimes | grep -q 'Microsoft.NETCore.App 8\.'; then
            echo "NET 8 runtime eksik. Test ve canli calistirma icin WSL'e bir kez kurulmali:"
            echo "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --runtime dotnet --channel 8.0 --install-dir /usr/lib/dotnet"
            echo "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --runtime aspnetcore --channel 8.0 --install-dir /usr/lib/dotnet"
            exit 1
          fi
          echo "NET 8 runtime mevcut"

      - name: Bağımlılıkları yükle (restore)
        run: dotnet restore /p:UseSharedCompilation=false

      - name: Projeyi derle (build)
        run: dotnet build --no-restore --configuration Release /p:UseSharedCompilation=false

      - name: Testleri çalıştır
        run: dotnet test --no-build --configuration Release --verbosity normal /p:UseSharedCompilation=false
