name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Kodu indir (checkout)
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bağımlılıkları yükle (restore)
        run: dotnet restore

      - name: Projeyi derle (build)
        run: dotnet build --no-restore --configuration Release

      - name: Testleri çalıştır
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Yayınla (publish)
        run: dotnet publish HelloApi/HelloApi.csproj --configuration Release --output /opt/helloapi

      - name: Servisi yeniden başlat
        run: systemctl restart helloapi
